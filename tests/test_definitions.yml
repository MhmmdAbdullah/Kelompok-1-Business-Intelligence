# Enam test kualitas data Kelompok 1 - T3 Kota Bogor.
# SQL mengembalikan satu angka: jumlah baris/kelompok yang melanggar.
# perkiraan_baris berasal dari profiling read-only pada snapshot K1, bukan tebakan.

tests:
  - name: duplikat_grain_desa_slot_snapshot
    topic: t3
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM (
        SELECT adm4, local_datetime, analysis_date
        FROM raw_prakiraan_cuaca
        GROUP BY 1,2,3 HAVING count(*) > 1
      )
    expected: pass
    perkiraan_baris: 0
    justifikasi: Grain fact adalah satu desa pada satu slot dalam satu snapshot; duplikat menggandakan seluruh measure.

  - name: curah_hujan_negatif
    topic: t3
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca
      WHERE TRY_CAST(tp AS DOUBLE) < 0
    expected: pass
    perkiraan_baris: 0
    justifikasi: Curah hujan dalam milimeter tidak mungkin negatif dan nilai tersebut merusak agregasi per desa.

  - name: kode_desa_tidak_ada_di_master
    topic: t3
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca f
      WHERE NOT EXISTS (
        SELECT 1 FROM raw_desa d WHERE d.kode = f.adm4
      )
    expected: pass
    perkiraan_baris: 0
    justifikasi: Setiap fakta wajib memperoleh wilayah_sk; kode orphan akan masuk Unknown dan menghilangkan lokasi analisis.

  - name: visibilitas_kosong
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca
      WHERE vs IS NULL OR trim(vs) = ''
    expected: fail
    perkiraan_baris: 1156
    justifikasi: Seluruh kolom visibilitas kosong, sehingga vs dan vs_text sengaja tidak dimuat sebagai measure.

  - name: deskripsi_cuaca_bukan_kunci_unik
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM (
        SELECT weather_desc FROM raw_prakiraan_cuaca
        GROUP BY 1 HAVING count(DISTINCT weather) > 1
      )
    expected: fail
    perkiraan_baris: 1
    justifikasi: Deskripsi Cerah digunakan kode 0 dan 1; karena itu weather_code, bukan deskripsi, menjadi natural key dim_cuaca.

  - name: time_index_bukan_jam_dinding
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca
      WHERE TRY_CAST(split_part(time_index, '-', 1) AS INTEGER) > 23
    expected: fail
    perkiraan_baris: 625
    justifikasi: time_index berisi horizon prakiraan hingga lebih dari 23 jam; memakainya sebagai jam akan menggeser analisis waktu.
